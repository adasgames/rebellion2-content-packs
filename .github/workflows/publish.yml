name: Publish content pack

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: Stable lowercase content-pack ID
        required: true
        default: twenty-fifth-anniversary
        type: string
      publish:
        description: Publish the package to Thunderstore
        required: true
        default: false
        type: boolean

concurrency:
  group: content-pack-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_ROLL_FORWARD: Major

jobs:
  package:
    name: Package content pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
      namespace: ${{ steps.pack.outputs.namespace }}
      name: ${{ steps.pack.outputs.name }}
      config: ${{ steps.pack.outputs.config }}
      archive: ${{ steps.pack.outputs.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs libxml2-utils
          ./build.sh all

      - name: Read release identity
        id: pack
        env:
          PACK_ID: ${{ inputs.pack_id }}
        run: python3 scripts/thunderstore_release.py metadata "$PACK_ID" >> "$GITHUB_OUTPUT"

      - name: Fetch content-pack LFS objects from R2
        env:
          LFS_PROXY_URL: ${{ vars.LFS_PROXY_URL }}
          PACK_DIRECTORY: ${{ steps.pack.outputs.directory }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          git lfs install
          proxy="${LFS_PROXY_URL%/}"
          proxy_host="${proxy#https://}"
          storage_host="${R2_ENDPOINT#https://}"
          git config lfs.url "https://${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}@${proxy_host}/${storage_host}/${R2_BUCKET}"
          git config lfs.concurrenttransfers 4
          git lfs pull --include="Content/Packs/${PACK_DIRECTORY}/**" --exclude=""
          pack="Content/Packs/${PACK_DIRECTORY}"
          if grep -RIl '^version https://git-lfs.github.com/spec/v1$' "$pack"; then
            echo "Content-pack checkout still contains Git LFS pointers." >&2
            exit 1
          fi

      - name: Build and verify Thunderstore package
        env:
          CONFIG: ${{ steps.pack.outputs.config }}
          VERSION: ${{ steps.pack.outputs.version }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          PACK_ID: ${{ inputs.pack_id }}
        run: |
          dotnet tool restore
          dotnet tool run tcli build --config-path "$CONFIG" --package-version "$VERSION"
          python3 scripts/thunderstore_release.py verify "$PACK_ID" "$ARCHIVE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-pack
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish to Thunderstore
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: content-pack
          path: package

      - name: Reject already published versions
        env:
          NAMESPACE: ${{ needs.package.outputs.namespace }}
          PACKAGE_NAME: ${{ needs.package.outputs.name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          url="https://thunderstore.io/api/experimental/package/${NAMESPACE}/${PACKAGE_NAME}/${VERSION}/"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
          case "$status" in
            404) ;;
            200) echo "This version is already published. Increase the version in pack.xml." >&2; exit 1 ;;
            *) echo "Could not check the published version (HTTP $status)." >&2; exit 1 ;;
          esac

      - name: Publish verified archive
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          CONFIG: ${{ needs.package.outputs.config }}
          VERSION: ${{ needs.package.outputs.version }}
          ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          set -euo pipefail
          if [[ -z "$TCLI_AUTH_TOKEN" ]]; then
            echo "Configure the THUNDERSTORE_TOKEN repository secret with a publishing service-account token." >&2
            exit 1
          fi
          dotnet tool restore
          dotnet tool run tcli publish --config-path "$CONFIG" --package-version "$VERSION" --file "$ARCHIVE"
